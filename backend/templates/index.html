<!DOCTYPE html>
<html>

<head>
    <title>AI Drone Dashboard</title>

    <style>

        body{
            background:black;
            color:white;
            text-align:center;
            font-family:Arial;
        }

        h1{
            color:cyan;
        }

        .box{
            border:2px solid cyan;
            padding:20px;
            margin:20px;
            border-radius:10px;
        }

        button{
            padding:10px 20px;
            font-size:18px;
            cursor:pointer;
        }

    </style>

</head>

<body>

    <h1>Autonomous Drone Dashboard</h1>

    <div class="box">

        <h2>Live Drone Camera</h2>

        <img src="/video" width="700">

    </div>

    <div class="box">

        <h2>Upload Image</h2>

        <form action="/upload-image" method="post" enctype="multipart/form-data">

            <input type="file" name="file">

            <button type="submit">Upload Image</button>

        </form>

    </div>

    <div class="box">

        <h2>Upload Video</h2>

        <form action="/upload-video" method="post" enctype="multipart/form-data">

            <input type="file" name="file">

            <button type="submit">Upload Video</button>

        </form>

    </div>

</body>

</html>
